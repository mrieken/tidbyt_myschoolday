[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tidbyt-school-timetable"
version = "0.1.0"
description = "A scheduled five-lesson display for Tidbyt Gen 1"
requires-python = ">=3.12"
dependencies = [
    "holidays==0.77",
    "Pillow==11.3.0",
    "PyYAML==6.0.2",
    "requests==2.32.4",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]