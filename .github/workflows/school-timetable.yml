
name: School timetable

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Timetable operation'
        required: true
        type: choice
        default: publish
        options:
          - publish
          - remove

  repository_dispatch:
    types:
      - timetable-publish
      - timetable-remove

permissions:
  contents: read

concurrency:
  group: tidbyt-school-timetable
  cancel-in-progress: false

jobs:
  scheduled-operation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -e .

      - name: Log execution
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "UTC: $(date -u)"
          echo "Berlin: $(TZ=Europe/Berlin date)"

      - name: Publish timetable
        if: >-
          (github.event_name == 'repository_dispatch' &&
           github.event.action == 'timetable-publish') ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.operation == 'publish')
        run: python -m tidbyt_timetable.cli publish
        env:
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}

      - name: Remove timetable
        if: >-
          (github.event_name == 'repository_dispatch' &&
           github.event.action == 'timetable-remove') ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.operation == 'remove')
        run: python -m tidbyt_timetable.cli remove
        env:
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
