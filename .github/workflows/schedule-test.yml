
name: Schedule Test

on:
  workflow_dispatch:
  schedule:
    - cron: '7,26,37,52 * * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Log schedule execution
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Execution time (UTC):"
          date -u
